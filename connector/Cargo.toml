[package]
name = "connector"
version = "0.1.0"
edition = "2024"

[dependencies]
blake2 = "0.11.0"
chacha20poly1305 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zstd = "0.14.3"

[dev-dependencies]
hex = "0.4.3"
