syntax = "proto3";

package dbgopher.relay;

message ConnectorMessage {
  oneof message {
    Hello hello = 1;
    Response response = 2;
    KeyConfig key_config = 3;
    Enroll enroll = 4;
  }
}

message RelayMessage {
  oneof message {
    Welcome welcome = 1;
    Close close = 2;
    Request request = 3;
    Enrolled enrolled = 4;
  }
}

message Hello {
  string connector_version = 1;
  string connector_id = 2;
  string token = 3;
}

message Welcome {}

message Enroll {
  string connector_id = 1;
  string enrollment_token = 2;
  bytes identity_key = 3;
  bytes proof = 4;
}

message Enrolled {
  string token = 1;
}

message KeyConfig {
  bytes config = 1;
  bytes signature = 2;
}

message Close {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_UNAUTHORIZED = 1;
    REASON_REPLACED = 2;
  }

  Reason reason = 1;
  string detail = 2;
}

message Request {
  uint64 id = 1;
  bytes sealed = 2;
}

message Response {
  uint64 request_id = 1;

  oneof result {
    bytes sealed = 2;
    Rejection rejection = 3;
  }
}

message Rejection {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_UNDECRYPTABLE = 1;
    REASON_MALFORMED = 2;
    REASON_STALE_KEY = 3;
    REASON_UNAUTHORIZED = 4;
  }

  Reason reason = 1;
}
