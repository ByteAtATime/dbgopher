syntax = "proto3";

package dbgopher.relay;

message ConnectorMessage {
  oneof message {
    Hello hello = 1;
    Response response = 2;
    Prekey prekey = 3;
  }
}

message RelayMessage {
  oneof message {
    Welcome welcome = 1;
    Close close = 2;
    Request request = 3;
  }
}

message Hello {
  uint32 protocol_version = 1;
  string connector_version = 2;
  string connector_id = 3;
  string token = 4;
}

message Welcome {}

message Prekey {
  bytes public_key = 1;
}

message Close {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_UPDATE_REQUIRED = 1;
    REASON_UNAUTHORIZED = 2;
    REASON_REPLACED = 3;
  }

  Reason reason = 1;
  string detail = 2;
}

message Request {
  reserved 2;
  reserved "session_id";
  uint64 id = 1;
  bytes sealed = 3;
}

message Response {
  uint64 request_id = 1;

  oneof result {
    bytes sealed = 2;
    Rejection rejection = 3;
  }
}

message Rejection {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_UNDECRYPTABLE = 1;
    REASON_EXPIRED = 2;
    REASON_REPLAYED = 3;
    REASON_MALFORMED = 4;
    REASON_STALE_KEY = 6;

    reserved 5;
    reserved "REASON_UNKNOWN_SESSION";
  }

  Reason reason = 1;
}
