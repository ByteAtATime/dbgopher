syntax = "proto3";

package dbgopher.relay;

message ConnectorMessage {
  reserved 3;
  reserved "prekey";

  oneof message {
    Hello hello = 1;
    Response response = 2;
    KeyConfig key_config = 4;
    Enroll enroll = 5;
  }
}

message RelayMessage {
  oneof message {
    Welcome welcome = 1;
    Close close = 2;
    Request request = 3;
    Enrolled enrolled = 4;
  }
}

message Hello {
  uint32 protocol_version = 1;
  string connector_version = 2;
  string connector_id = 3;
  string token = 4;
}

message Welcome {}

message Enroll {
  uint32 protocol_version = 1;
  string connector_id = 2;
  string enrollment_token = 3;
  bytes identity_key = 4;
  bytes proof = 5;
}

message Enrolled {
  string token = 1;
}

message KeyConfig {
  bytes config = 1;
  bytes signature = 2;
}

message Close {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_UPDATE_REQUIRED = 1;
    REASON_UNAUTHORIZED = 2;
    REASON_REPLACED = 3;
  }

  Reason reason = 1;
  string detail = 2;
}

message Request {
  reserved 2;
  reserved "session_id";
  uint64 id = 1;
  bytes sealed = 3;
}

message Response {
  uint64 request_id = 1;

  oneof result {
    bytes sealed = 2;
    Rejection rejection = 3;
  }
}

message Rejection {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_UNDECRYPTABLE = 1;
    REASON_MALFORMED = 4;
    REASON_STALE_KEY = 6;
    REASON_UNAUTHORIZED = 7;

    reserved 2, 3, 5;
    reserved "REASON_EXPIRED", "REASON_REPLAYED", "REASON_UNKNOWN_SESSION";
  }

  Reason reason = 1;
}
